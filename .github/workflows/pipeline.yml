name: Smart Terraform Pipeline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changed Stacks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      should_run: ${{ steps.detect.outputs.should_run }}
      only_docs: ${{ steps.detect.outputs.only_docs }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Affected Terraform Directories
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi

          mapfile -t changed_files < <(git diff --name-only "${base_sha}" "${head_sha}")

          printf 'Changed files:\n%s\n' "${changed_files[*]:-<none>}"

          if [[ ${#changed_files[@]} -eq 0 ]]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            echo 'only_docs=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          only_changelog=true
          run_all_apps=false
          declare -A selected=()

          for file in "${changed_files[@]}"; do
            if [[ "$file" != "CHANGELOG.md" ]]; then
              only_changelog=false
            fi

            case "$file" in
              global/iam/*)
                run_all_apps=true
                ;;
              apps/payment-api/*)
                selected["payment-api"]=1
                ;;
              apps/user-api/*)
                selected["user-api"]=1
                ;;
            esac
          done

          if [[ "$only_changelog" == true ]]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            echo 'only_docs=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$run_all_apps" == true ]]; then
            selected["payment-api"]=1
            selected["user-api"]=1
          fi

          entries=()

          if [[ -n "${selected[payment-api]:-}" ]]; then
            entries+=('{"name":"payment-api","path":"apps/payment-api"}')
          fi

          if [[ -n "${selected[user-api]:-}" ]]; then
            entries+=('{"name":"user-api","path":"apps/user-api"}')
          fi

          if [[ ${#entries[@]} -eq 0 ]]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            echo 'only_docs=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix_json=$(printf '%s\n' "${entries[@]}" | python3 -c 'import json,sys; print(json.dumps({"include":[json.loads(line) for line in sys.stdin if line.strip()]}))')

          echo "matrix=${matrix_json}" >> "$GITHUB_OUTPUT"
          echo 'should_run=true' >> "$GITHUB_OUTPUT"
          echo 'only_docs=false' >> "$GITHUB_OUTPUT"

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set -o pipefail
          terraform plan -input=false -no-color 2>&1 | tee plan.txt

      - name: Publish Plan To Step Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Terraform Plan: ${matrix.name}"
            echo
            echo "Path: \`${matrix.path}\`"
            echo
            echo '```text'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Plan Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.name }}
          path: ${{ matrix.path }}/plan.txt

  no-op-summary:
    name: No Terraform Changes
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.should_run == 'false'
    steps:
      - name: Publish No-Op Summary
        run: |
          if [[ "${{ needs.detect-changes.outputs.only_docs }}" == "true" ]]; then
            echo "## No Terraform Plan Required" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "Only \`CHANGELOG.md\` changed, so the workflow exited successfully without running Terraform." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## No Terraform Plan Required" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "No affected Terraform directories were detected for this change set." >> "$GITHUB_STEP_SUMMARY"
          fi
